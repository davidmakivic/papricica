server:
  port: 8080

spring:
  datasource: # setting up Postgres DB
    url: jdbc:postgresql://localhost:5432/papricica
    username: papricica
    password: papricica
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always # always execute data/schema.sql

  jpa:
    hibernate:
      ddl-auto: update # upon starting look at my entities and update the DB schema
    open-in-view: false # manages how long hibernate should remain available to catch additional data (lazy loading)

  flyway:
    enabled: false

  profiles:
    active: generateData

logging:
  level:
    org:
      springframework:
        web: DEBUG

security:
  auth:
    header: Authorization
    prefix: "Bearer "
    login-uri: /api/v1/authentication
  jwt:
    secret: ?E(H+MbQeThWmZq4t7w!z%C*F-J@NcRfUjXn2r5u8x/A?D(G+KbPdSgVkYp3s6v9
    type: JWT
    issuer: secure-backend
    audience: secure-app
    # 15 minutes in milliseconds
    expiration-time: 900000


# manages what diagnostic endpoints are exposed
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    from: ${MAIL_USERNAME}
